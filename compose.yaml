# Until real inference backends land, the stack points at the fake server.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arkanine
      POSTGRES_PASSWORD: arkanine
      POSTGRES_DB: arkanine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkanine"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-inference:
    build: testing/fake_inference
    ports:
      - "${FAKE_INFERENCE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/v1/models')"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://arkanine:arkanine@db:5432/arkanine
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://fake-inference:8080/v1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      fake-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
