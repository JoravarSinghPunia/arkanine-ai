# By default the stack uses the fake inference server. `make dev BACKEND=<name>` points it
# at a real model server instead; see docs/models.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arkanine
      POSTGRES_PASSWORD: arkanine
      POSTGRES_DB: arkanine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkanine"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-inference:
    build: testing/fake_inference
    ports:
      - "${FAKE_INFERENCE_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8080/v1/models')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://arkanine:arkanine@db:5432/arkanine
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://fake-inference:8080/v1}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-fake-chat}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      # Empty means the same server and key as chat.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embed}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      # Development default only; set your own before running anywhere real.
      ARKANINE_ADMIN_USERNAME: ${ARKANINE_ADMIN_USERNAME:-admin}
      ARKANINE_ADMIN_PASSWORD: ${ARKANINE_ADMIN_PASSWORD:-arkanine-dev-admin}
    ports:
      - "${API_PORT:-8000}:8000"
    # Model servers run on the host; Docker Desktop provides this name, Linux needs it mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      fake-inference:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
